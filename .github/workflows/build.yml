name: Application delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:
    inputs:
      services:
        description: 'all or comma-separated services (ui,catalog,cart,checkout,orders)'
        default: all
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: application-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Select and test services
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_changes: ${{ steps.select.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test pipeline safeguards
        run: node --test scripts/ci/tests/*.test.mjs
      - id: select
        name: Select changed services
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/select-services.mjs
      - name: Explain AWS gates
        env:
          PUBLISH: ${{ vars.AWS_PUBLISH_ENABLED }}
          DEPLOY: ${{ vars.AWS_DEPLOY_ENABLED }}
        run: |
          echo "AWS publish enabled: ${PUBLISH:-false}; deploy enabled: ${DEPLOY:-false}. AWS jobs only run on main." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned application source
        if: matrix.source == 'upstream'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws-containers/retail-store-sample-app
          ref: ${{ matrix.revision }}
          path: upstream
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without AWS credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: false
          tags: group14/${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  publish:
    name: Publish ${{ matrix.service }}
    needs: [changes, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_PUBLISH_ENABLED == 'true' && needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      AWS_REGION: ap-southeast-1
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record start
        run: echo "JOB_STARTED_MS=$(node -e 'console.log(Date.now())')" >> "$GITHUB_ENV"
      - name: Reject stale main reruns
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/github.mjs
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: build-${{ github.run_id }}
          unset-current-credentials: true
      - id: image
        name: Reuse existing immutable image on retries
        env:
          SERVICE: ${{ matrix.service }}
        run: node scripts/ci/ecr-image.mjs lookup "$SERVICE"
      - name: Check out pinned application source
        if: steps.image.outputs.exists != 'true' && matrix.source == 'upstream'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aws-containers/retail-store-sample-app
          ref: ${{ matrix.revision }}
          path: upstream
          persist-credentials: false
      - name: Login to ECR
        if: steps.image.outputs.exists != 'true'
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin "$REGISTRY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.exists != 'true'
      - name: Publish image using the verified build cache
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tagged_image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Save exact image digest
        env:
          SERVICE: ${{ matrix.service }}
        run: node scripts/ci/ecr-image.mjs receipt "$SERVICE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}-${{ github.run_attempt }}
          path: receipts/${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy changed services
    needs: [changes, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true' && vars.AWS_PUBLISH_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      matrix: ${{ needs.changes.outputs.matrix }}

  delivery-check:
    name: Delivery checks
    if: always()
    needs: [changes, build, publish, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail if any required stage failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=Object.values(JSON.parse(process.env.RESULTS)); if(jobs.some(j=>["failure","cancelled"].includes(j.result))) process.exit(1);'
