name: ECS deploy

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: ECS ${{ matrix.service }}
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '5'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read deployment gate
        id: target
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          node --input-type=module -e 'import {loadTargets,output,requireService,summary} from "./scripts/ci/common.mjs"; const name=requireService(process.env.SERVICE); const enabled=loadTargets().services[name].enabled; output("enabled",String(enabled)); if(!enabled) summary(name+": disabled until A hands over the ECS service");'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.target.outputs.enabled == 'true'
        with:
          pattern: image-${{ matrix.service }}-*
          path: receipts
          merge-multiple: true
      - name: Authenticate to AWS with OIDC
        if: steps.target.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          role-session-name: deploy-${{ github.run_id }}
          unset-current-credentials: true
      - name: Reject stale main reruns
        if: steps.target.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/github.mjs
      - name: Deploy and verify the exact revision
        if: steps.target.outputs.enabled == 'true'
        env:
          SERVICE: ${{ matrix.service }}
        run: node scripts/ci/deploy-service.mjs "$SERVICE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.target.outputs.enabled == 'true'
        with:
          name: deployment-${{ matrix.service }}-${{ github.run_attempt }}
          path: deployment-results/${{ matrix.service }}.json
          if-no-files-found: warn
          retention-days: 14
